site_name: Aakvatech Docs
site_description: Frappe application guides
theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search
